# One-time setup (e.g., install system tools, global CLIs).
initialize:
  - name: install Android SDK (cmdline-tools, platform 35, build-tools 34)
    run: |
      set -e
      SDK=$HOME/android-sdk
      if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
        mkdir -p "$SDK/cmdline-tools"
        curl -fsSLo /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q -o /tmp/clt.zip -d "$SDK/cmdline-tools"
        rm -rf "$SDK/cmdline-tools/latest" && mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
        rm -f /tmp/clt.zip
      fi
      yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null
      "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platform-tools" "platforms;android-35" "build-tools;34.0.0" > /dev/null
      echo "ANDROID_HOME=$SDK" >> $ENVRC
      echo "ANDROID_SDK_ROOT=$SDK" >> $ENVRC
  - name: install Node.js 20
    run: |
      if ! node -v 2>/dev/null | grep -q '^v20'; then
        curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
        sudo apt-get install -y nodejs
      fi
# Install project dependencies (runs during builds, surfaced to agent at session start).
maintenance:
  - name: resolve Gradle wrapper and dependencies
    run: ./gradlew --no-daemon :app:dependencies -q > /dev/null
knowledge:
  - name: test
    contents: |
      ./gradlew testDebugUnitTest            # Android JVM unit tests
      (cd desktop && npm test)               # desktop core tests (no npm install needed)
      ./gradlew connectedDebugAndroidTest    # needs a running emulator/device (not provisioned)
  - name: build
    contents: |
      ./gradlew assembleDebug   # -> app/build/outputs/apk/debug/app-debug.apk; release signing needs signing.properties or CODE_CANVAS_KEYSTORE_* env (not provided)
  - name: notes
    contents: |
      settings.gradle.kts uses Aliyun mirrors unless CI/GITHUB_ACTIONS is set; with CI=true Maven Central returned 429 here, so leave CI unset.
---
runs-on: windows
maintenance:
  - name: fetch WebView2 SDK DLLs into desktop/native/lib (gitignored)
    run: |
      set -e
      V=1.0.4314.35
      T=$(mktemp -d)
      curl -fsSL -o "$T/wv2.zip" "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$V/microsoft.web.webview2.$V.nupkg"
      mkdir -p desktop/native/lib
      unzip -joq "$T/wv2.zip" 'lib/net462/Microsoft.Web.WebView2.Core.dll' 'lib/net462/Microsoft.Web.WebView2.WinForms.dll' 'runtimes/win-x64/native/WebView2Loader.dll' -d desktop/native/lib
      rm -rf "$T"
knowledge:
  - name: test
    contents: |
      cd desktop && npm.cmd test   # node core tests; in Git Bash use npm.cmd (bare npm shim is broken)
  - name: build
    contents: |
      cd desktop && npm.cmd run dist:win   # native/build-native.ps1 (csc.exe + WebView2) -> desktop/dist/CodeCanvas-Setup-0.5.0.exe; rewrites docs/update/desktop-latest.json, git checkout it if not releasing
  - name: notes
    contents: |
      Shipped Windows app is C# + system WebView2 (desktop/native/), not the Electron sources in desktop/; no npm install needed for it.
