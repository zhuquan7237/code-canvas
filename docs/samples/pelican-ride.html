<title>鹈鹕骑行</title>
<style>
html,body{margin:0;height:100%;background:#f6ead7;font-family:sans-serif;color:#1e293b;overflow:auto}
#stage{width:100%;height:100%;display:block}
.cloud{animation:drift 14s linear infinite}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(40px)}}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wing{transform-box:fill-box;transform-origin:80% 70%;animation:flap 0.8s ease-in-out infinite}
@keyframes flap{50%{transform:rotate(-18deg)}}
.card{position:absolute;background:#fffdf8;border-radius:16px;box-shadow:0 8px 24px rgba(15,23,42,.12);padding:10px 12px}
#diary{left:12px;top:16px;max-width:46%}
#meters{right:12px;top:16px;display:flex;gap:10px}
.k{font-size:11px;letter-spacing:.04em;color:#64748b}
.v{font-size:22px;font-weight:700}
.u{font-size:12px;color:#64748b}
.bar{position:absolute;left:0;right:0;bottom:18px;display:flex;gap:8px;justify-content:center;padding:0 10px}
button{border:0;border-radius:999px;padding:12px 14px;font-size:14px;font-weight:700;color:#fff}
#go{background:#14b8a6}#bell{background:#f59e0b}#pause{background:#22c55e}#wind{background:#38bdf8;color:#0f172a}
button.on{outline:3px solid #0f172a}
</style>
</head>

<div class="card" id="diary"><div class="k">日记 · 鹈鹕号</div><div id="note">匀速滑行</div><div class="k">红嘴白羽 · 海滨栈道</div></div>
<div id="meters">
  <div class="card"><div class="k">SPEED · 实时车速</div><div><span class="v" id="speed">12.4</span> <span class="u">km/h</span></div></div>
  <div class="card"><div class="k">TRIP · 骑行里程</div><div><span class="v" id="trip">0.42</span> <span class="u">km</span></div></div>
</div>
<div class="bar">
  <button id="go" type="button">踏板加速</button>
  <button id="bell" type="button">清脆车铃</button>
  <button id="pause" type="button">暂停日记</button>
  <button id="wind" type="button">风种海风</button>
</div>
<script>
var speed=12.4, trip=0.42, acc=false, paused=false, wind=false;
var sp=document.getElementById('speed'), tr=document.getElementById('trip'), note=document.getElementById('note');
setInterval(function(){
  if(paused) return;
  var add=acc?2.8:0.6;
  if(wind) add+=0.4;
  speed=Math.max(0, Math.min(36, speed+(acc?0.35:-0.05)+Math.sin(Date.now()/700)*0.15));
  trip+=add/80;
  sp.textContent=speed.toFixed(1);
  tr.textContent=trip.toFixed(2);
}, 200);
document.getElementById('go').onclick=function(){
  acc=!acc; this.classList.toggle('on', acc);
  this.textContent=acc?'加速中':'踏板加速';
  note.textContent=acc?'踏板已踩下':'匀速滑行';
};
document.getElementById('bell').onclick=function(){ note.textContent='车铃：叮铃'; };
document.getElementById('pause').onclick=function(){
  paused=!paused; this.textContent=paused?'继续日记':'暂停日记';
  note.textContent=paused?'日记已暂停':'日记继续';
};
document.getElementById('wind').onclick=function(){
  wind=!wind; this.classList.toggle('on', wind);
  this.textContent=wind?'海风：开':'风种海风';
};
</script>

<section id="log" style="position:relative;margin-top:8px;padding:28px 16px 48px;background:#fffdf8">
  <h2 style="margin:0 0 8px">今日记录</h2>
  <p>把这一页向下滑动，能看到这段文字。上面的按钮、车速和海风动画仍然在第一屏。车轮、翅膀和太阳都由样式动画驱动，车速由定时器刷新。</p>
</section>
