<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; text-align: center; }
    .badge { display: inline-block; padding: 4px 12px; background: #0d9488; color: #fff; border-radius: 999px; font-size: 12px; font-weight: bold; margin-bottom: 12px; }
    h1 { font-size: 24px; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 14px; line-height: 1.6; max-width: 400px; margin: 0 auto 20px auto; }
    .btn { background: #14b8a6; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: transform 0.1s; }
    .btn:active { transform: scale(0.96); }
  </style>
</head>
<body>
  <div class="badge">CodeCanvas 示例</div>
  <h1>极简代码画布</h1>
  <p>纯原生高能效渲染器。支持直接粘贴、无缝切换预览，支持任意格式文件后缀。</p>
  <button class="btn" onclick="alert('代码画布已准备就绪！')">点击测试互动</button>
</body>
</html>
