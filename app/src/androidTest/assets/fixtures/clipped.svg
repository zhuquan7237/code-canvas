<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <defs>
    <clipPath id="c"><circle cx="150" cy="100" r="70"/></clipPath>
  </defs>
  <rect x="0" y="0" width="300" height="200" fill="#DCF2E6"/>
  <rect x="40" y="30" width="220" height="140" fill="#B42318" clip-path="url(#c)"/>
  <text x="150" y="190" font-size="13" text-anchor="middle" fill="#53627A" font-family="sans-serif">内部 clipPath 有意裁切</text>
</svg>
