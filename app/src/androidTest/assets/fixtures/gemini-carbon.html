<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>海滩骑行日记 · 鹈鹕与粉红单车</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #f6ead7;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  svg#diary-stage {
    width: 100vw; height: 100vh;
    max-width: 100%; max-height: 100%;
    display: block;
    touch-action: manipulation;
  }
  .btn-group { cursor: pointer; transition: transform 0.12s ease; }
  .btn-group:hover { filter: brightness(1.03); }
  .btn-group:active { transform: translateY(2px); }
  .tabular { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
</style>
</head>
<body>

<svg id="diary-stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- 天空与海洋渐变 -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#84d2f6" />
      <stop offset="52%" stop-color="#c9eff9" />
      <stop offset="100%" stop-color="#fff3d6" />
    </linearGradient>
    <linearGradient id="deepSeaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1982c4" />
      <stop offset="100%" stop-color="#2ec4b6" />
    </linearGradient>
    <linearGradient id="midSeaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2ec4b6" />
      <stop offset="100%" stop-color="#72efdd" />
    </linearGradient>
    <linearGradient id="sandGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe5a5" />
      <stop offset="100%" stop-color="#f7c97e" />
    </linearGradient>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#747b8c" />
      <stop offset="55%" stop-color="#5c6373" />
      <stop offset="100%" stop-color="#4b5160" />
    </linearGradient>

    <!-- 鹈鹕与粉车材质渐变 -->
    <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#ffd166" />
      <stop offset="70%" stop-color="#f8961e" />
      <stop offset="100%" stop-color="#f3722c" />
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0.2" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="65%" stop-color="#fb8500" />
      <stop offset="100%" stop-color="#e85d04" />
    </linearGradient>
    <linearGradient id="pinkFrame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff85a9" />
      <stop offset="55%" stop-color="#ff4d84" />
      <stop offset="100%" stop-color="#d92b66" />
    </linearGradient>
    <linearGradient id="cardPaper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf8" stop-opacity="0.94" />
      <stop offset="100%" stop-color="#fcf4e4" stop-opacity="0.92" />
    </linearGradient>

    <!-- 柔和投影 -->
    <filter id="softShadow" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1d3557" flood-opacity="0.14" />
    </filter>
    <filter id="sunGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 第1层：远景云朵单元 (宽1200无缝平铺) -->
    <g id="tile-layer1">
      <!-- 云群A -->
      <g fill="#ffffff" opacity="0.92">
        <path d="M90,155 Q90,122 125,122 Q142,92 182,98 Q218,86 240,118 Q272,120 272,155 Z" />
        <path d="M510,125 Q510,98 540,98 Q562,72 598,80 Q625,75 642,102 Q668,105 668,125 Z" opacity="0.82" />
        <path d="M880,162 Q880,132 912,130 Q935,95 980,104 Q1022,94 1044,126 Q1076,128 1076,162 Z" />
      </g>
      <!-- 远方海鸥 -->
      <path d="M380,115 Q390,105 400,114 Q410,105 420,115" fill="none" stroke="#648ca8" stroke-width="2.4" stroke-linecap="round" />
      <path d="M432,128 Q440,120 448,127 Q456,120 464,128" fill="none" stroke="#648ca8" stroke-width="2" stroke-linecap="round" />
      <path d="M785,96 Q794,87 803,95 Q812,87 821,96" fill="none" stroke="#648ca8" stroke-width="2.2" stroke-linecap="round" />
    </g>

    <!-- 第2层：远海与白帆船 (宽1200无缝平铺) -->
    <g id="tile-layer2">
      <rect x="0" y="268" width="1202" height="58" fill="url(#deepSeaGrad)" />
      <!-- 远景闪光波纹 -->
      <g stroke="#80ed99" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round">
        <line x1="70" y1="285" x2="145" y2="285" />
        <line x1="340" y1="296" x2="430" y2="296" />
        <line x1="690" y1="282" x2="775" y2="282" />
        <line x1="980" y1="294" x2="1080" y2="294" />
      </g>
      <!-- 帆船 1 -->
      <g class="sailboat" transform="translate(210, 272)">
        <path d="M-24,0 L24,0 L16,9 L-16,9 Z" fill="#e63946" />
        <line x1="0" y1="0" x2="0" y2="-48" stroke="#f1faee" stroke-width="2.5" />
        <path d="M2,-46 L28,-5 L2,-5 Z" fill="#ffffff" />
        <path d="M-2,-42 L-20,-5 L-2,-5 Z" fill="#ffe5ec" />
        <path d="M0,-48 L12,-43 L0,-39 Z" fill="#ffb703" />
      </g>
      <!-- 帆船 2 -->
      <g class="sailboat" transform="translate(640, 266) scale(0.78)">
        <path d="M-24,0 L24,0 L16,9 L-16,9 Z" fill="#1d3557" />
        <line x1="0" y1="0" x2="0" y2="-48" stroke="#ffffff" stroke-width="2.5" />
        <path d="M2,-46 L28,-5 L2,-5 Z" fill="#fffdf7" />
        <path d="M-2,-40 L-19,-5 L-2,-5 Z" fill="#ffcad4" />
      </g>
      <!-- 帆船 3 -->
      <g class="sailboat" transform="translate(1015, 274) scale(0.92)">
        <path d="M-24,0 L24,0 L16,9 L-16,9 Z" fill="#f4a261" />
        <line x1="0" y1="0" x2="0" y2="-50" stroke="#ffffff" stroke-width="2.5" />
        <path d="M2,-48 L29,-5 L2,-5 Z" fill="#ffffff" />
        <path d="M-2,-42 L-21,-5 L-2,-5 Z" fill="#a8dadc" />
        <path d="M0,-50 L11,-46 L0,-42 Z" fill="#ff5d8f" />
      </g>
    </g>

    <!-- 第3层：浅海碧波与白浪花 (宽1200无缝平铺) -->
    <g id="tile-layer3">
      <path d="M0,312 Q75,302 150,312 T300,312 T450,312 T600,312 T750,312 T900,312 T1050,312 T1200,312 L1200,378 L0,378 Z" fill="url(#midSeaGrad)" />
      <path d="M0,312 Q75,302 150,312 T300,312 T450,312 T600,312 T750,312 T900,312 T1050,312 T1200,312" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-opacity="0.72" />
      <!-- 海浪白沫纹理 -->
      <path d="M40,342 Q95,334 150,342 M380,348 Q445,339 510,348 M760,340 Q825,332 890,340 M1040,350 Q1100,342 1160,350" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.65" />
    </g>

    <!-- 第4层：黄金沙滩、彩色木屋与椰林 (宽1200无缝平铺) -->
    <g id="tile-layer4">
      <!-- 起伏沙丘 -->
      <path d="M0,368 Q180,350 380,364 T780,360 T1200,368 L1200,458 L0,458 Z" fill="url(#sandGrad)" />
      <path d="M0,368 Q180,350 380,364 T780,360 T1200,368" fill="none" stroke="#fff8e7" stroke-width="4" opacity="0.85" />

      <!-- 椰子树 1 -->
      <g transform="translate(115, 392)">
        <path d="M0,0 Q-14,-48 -6,-92" fill="none" stroke="#9c6644" stroke-width="9" stroke-linecap="round" />
        <g transform="translate(-6, -92)" fill="#2a9d8f">
          <path d="M0,0 Q-38,-14 -56,12 Q-26,4 0,0 Z" />
          <path d="M0,0 Q-24,-34 -6,-52 Q-2,-24 0,0 Z" fill="#40916c" />
          <path d="M0,0 Q32,-26 54,-4 Q24,-4 0,0 Z" />
          <path d="M0,0 Q38,4 48,30 Q20,14 0,0 Z" fill="#52b788" />
          <circle cx="-4" cy="5" r="4.5" fill="#7f4f24" />
          <circle cx="5" cy="6" r="4.5" fill="#7f4f24" />
        </g>
      </g>

      <!-- 海滩彩色小屋 1 (粉白条纹) -->
      <g transform="translate(245, 336)">
        <rect x="0" y="24" width="58" height="52" rx="2" fill="#fff8f0" stroke="#e09f7d" stroke-width="1.5" />
        <rect x="8" y="24" width="8" height="52" fill="#ff85a9" opacity="0.55" />
        <rect x="25" y="24" width="8" height="52" fill="#ff85a9" opacity="0.55" />
        <rect x="42" y="24" width="8" height="52" fill="#ff85a9" opacity="0.55" />
        <polygon points="-7,26 29,0 65,26" fill="#ff5d8f" />
        <rect x="20" y="40" width="18" height="36" rx="2" fill="#ffffff" stroke="#ff5d8f" stroke-width="2" />
        <circle cx="34" cy="58" r="2" fill="#ff5d8f" />
        <rect x="-6" y="74" width="70" height="5" rx="2" fill="#d4a373" />
      </g>

      <!-- 沙滩冲浪板与阳伞 -->
      <g transform="translate(362, 396)">
        <ellipse cx="0" cy="-22" rx="7" ry="26" transform="rotate(12)" fill="#ffb703" stroke="#ffffff" stroke-width="2" />
        <line x1="5" y1="4" x2="18" y2="-38" stroke="#8d5524" stroke-width="3" />
        <path d="M-12,-34 Q20,-58 46,-26 Z" fill="#ff6b6b" />
        <path d="M4,-31 Q20,-52 32,-28 Z" fill="#fffdf7" />
      </g>

      <!-- 海滩彩色小屋 2 (薄荷蓝) -->
      <g transform="translate(585, 332)">
        <rect x="0" y="26" width="62" height="54" rx="2" fill="#f1faee" stroke="#8ecae6" stroke-width="1.5" />
        <rect x="10" y="26" width="9" height="54" fill="#48cae4" opacity="0.5" />
        <rect x="28" y="26" width="9" height="54" fill="#48cae4" opacity="0.5" />
        <rect x="46" y="26" width="9" height="54" fill="#48cae4" opacity="0.5" />
        <polygon points="-7,28 31,1 69,28" fill="#0096c7" />
        <rect x="21" y="40" width="20" height="20" rx="2" fill="#ffffff" stroke="#0096c7" stroke-width="2" />
        <circle cx="62" cy="54" r="9" fill="none" stroke="#ef476f" stroke-width="4" />
        <circle cx="62" cy="54" r="9" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="6 8" />
        <rect x="-6" y="78" width="74" height="5" rx="2" fill="#d4a373" />
      </g>

      <!-- 椰子树 2 -->
      <g transform="translate(835, 396) scale(0.92)">
        <path d="M0,0 Q18,-46 10,-96" fill="none" stroke="#9c6644" stroke-width="9" stroke-linecap="round" />
        <g transform="translate(10, -96)" fill="#2a9d8f">
          <path d="M0,0 Q-42,-12 -58,14 Q-28,5 0,0 Z" />
          <path d="M0,0 Q-16,-38 8,-54 Q6,-24 0,0 Z" fill="#52b788" />
          <path d="M0,0 Q36,-22 56,2 Q26,-2 0,0 Z" />
          <path d="M0,0 Q32,12 42,34 Q16,16 0,0 Z" fill="#40916c" />
        </g>
      </g>

      <!-- 海滩柠檬黄木屋 3 -->
      <g transform="translate(955, 338)">
        <rect x="0" y="24" width="56" height="50" rx="2" fill="#fffdf5" stroke="#e9c46a" stroke-width="1.5" />
        <rect x="9" y="24" width="8" height="50" fill="#ffd166" opacity="0.65" />
        <rect x="25" y="24" width="8" height="50" fill="#ffd166" opacity="0.65" />
        <rect x="41" y="24" width="8" height="50" fill="#ffd166" opacity="0.65" />
        <polygon points="-6,26 28,2 62,26" fill="#f4a261" />
        <rect x="19" y="38" width="18" height="36" rx="2" fill="#ffffff" stroke="#f4a261" stroke-width="2" />
        <rect x="-5" y="72" width="66" height="5" rx="2" fill="#d4a373" />
      </g>
    </g>

    <!-- 第5层：海滨木栈道栏杆与骑行公路 (宽1200无缝平铺) -->
    <g id="tile-layer5">
      <!-- 白色海滨木护栏 -->
      <rect x="0" y="426" width="1202" height="6" fill="#fffdf9" />
      <rect x="0" y="440" width="1202" height="5" fill="#f3ece1" />
      <!-- 护栏木桩 (间距100) -->
      <g fill="#fffdf9" stroke="#e2d5c3" stroke-width="1">
        <rect x="20" y="416" width="10" height="40" rx="2" />
        <rect x="120" y="416" width="10" height="40" rx="2" />
        <rect x="220" y="416" width="10" height="40" rx="2" />
        <rect x="320" y="416" width="10" height="40" rx="2" />
        <rect x="420" y="416" width="10" height="40" rx="2" />
        <rect x="520" y="416" width="10" height="40" rx="2" />
        <rect x="620" y="416" width="10" height="40" rx="2" />
        <rect x="720" y="416" width="10" height="40" rx="2" />
        <rect x="820" y="416" width="10" height="40" rx="2" />
        <rect x="920" y="416" width="10" height="40" rx="2" />
        <rect x="1020" y="416" width="10" height="40" rx="2" />
        <rect x="1120" y="416" width="10" height="40" rx="2" />
      </g>
      <!-- 路缘石 -->
      <rect x="0" y="454" width="1202" height="12" fill="#f2e6d5" />
      <line x1="0" y1="466" x2="1202" y2="466" stroke="#d5c5ae" stroke-width="2" />
      <!-- 骑行柏油路 -->
      <rect x="0" y="466" width="1202" height="132" fill="url(#roadGrad)" />
      <!-- 自行车道粉色慢行边线 -->
      <line x1="0" y1="476" x2="1202" y2="476" stroke="#ff9ebb" stroke-width="3" opacity="0.7" />
      <!-- 道路中心虚线 (周期120，1200整除) -->
      <line x1="0" y1="532" x2="1200" y2="532" stroke="#fff6e0" stroke-width="5" stroke-dasharray="48 72" stroke-linecap="round" opacity="0.85" />
      <!-- 下方沙滩路肩 -->
      <rect x="0" y="596" width="1202" height="82" fill="#f5cb86" />
      <line x1="0" y1="596" x2="1202" y2="596" stroke="#fff1d0" stroke-width="4" />
    </g>

    <!-- 第6层：前景海草、贝壳与海星 (宽1200无缝平铺) -->
    <g id="tile-layer6">
      <!-- 贝壳与海星点缀 -->
      <g transform="translate(160, 622)">
        <polygon points="0,-10 3,-3 10,-3 5,2 7,9 0,5 -7,9 -5,2 -10,-3 -3,-3" fill="#ff758f" />
      </g>
      <g transform="translate(520, 632)">
        <path d="M-9,4 A10,10 0 0,1 9,4 Z" fill="#fff5eb" stroke="#e09f7d" stroke-width="1.5" />
      </g>
      <g transform="translate(910, 620)">
        <polygon points="0,-9 3,-3 9,-3 4,2 6,8 0,4 -6,8 -4,2 -9,-3 -3,-3" fill="#ff9f1c" />
      </g>
      <!-- 前景随风摇曳海滨草丛 -->
      <g stroke="#2a9d8f" stroke-width="4.5" stroke-linecap="round" fill="none">
        <path d="M60,678 Q48,635 32,608" />
        <path d="M68,678 Q72,630 88,602" stroke="#52b788" />
        <path d="M76,678 Q88,642 106,622" />

        <path d="M410,678 Q396,638 380,612" stroke="#52b788" />
        <path d="M418,678 Q424,634 440,605" />

        <path d="M760,678 Q744,632 725,600" />
        <path d="M770,678 Q776,634 795,606" stroke="#52b788" />
        <path d="M778,678 Q792,644 812,624" />

        <path d="M1110,678 Q1098,638 1082,612" stroke="#52b788" />
        <path d="M1118,678 Q1125,634 1142,608" />
      </g>
    </g>

    <!-- 车轮复用结构 (半径 62) -->
    <g id="bike-wheel">
      <!-- 奶油白边轮胎 -->
      <circle cx="0" cy="0" r="62" fill="none" stroke="#3a3d45" stroke-width="9" />
      <circle cx="0" cy="0" r="56.5" fill="none" stroke="#fff8e8" stroke-width="5.5" />
      <circle cx="0" cy="0" r="52.5" fill="none" stroke="#ff9ebb" stroke-width="2.5" />
      <!-- 银色辐条 -->
      <g stroke="#e5e9f0" stroke-width="1.8">
        <line x1="-51" y1="0" x2="51" y2="0" />
        <line x1="0" y1="-51" x2="0" y2="51" />
        <line x1="-36" y1="-36" x2="36" y2="36" />
        <line x1="-36" y1="36" x2="36" y2="-36" />
        <line x1="-47" y1="-19" x2="47" y2="19" />
        <line x1="-19" y1="-47" x2="19" y2="47" />
        <line x1="-47" y1="19" x2="47" y2="-19" />
        <line x1="-19" y1="47" x2="19" y2="-47" />
      </g>
      <!-- 气门嘴与反光片 -->
      <circle cx="34" cy="14" r="4" fill="#ffb703" />
      <circle cx="0" cy="0" r="8" fill="#ffffff" stroke="#ff4d84" stroke-width="3" />
    </g>
  </defs>

  <!-- ==================== 背景天空与暖阳 ==================== -->
  <rect width="1200" height="675" fill="url(#skyGrad)" />
  <g transform="translate(945, 118)">
    <circle cx="0" cy="0" r="54" fill="#ffe699" opacity="0.55" filter="url(#sunGlow)" />
    <circle cx="0" cy="0" r="38" fill="#fff7d6" />
  </g>

  <!-- ==================== 六层无缝视差海滩 ==================== -->
  <g id="parallax-world">
    <g id="p-layer-1"><use href="#tile-layer1" x="0" /><use href="#tile-layer1" x="1200" /></g>
    <g id="p-layer-2"><use href="#tile-layer2" x="0" /><use href="#tile-layer2" x="1200" /></g>
    <g id="p-layer-3"><use href="#tile-layer3" x="0" /><use href="#tile-layer3" x="1200" /></g>
    <g id="p-layer-4"><use href="#tile-layer4" x="0" /><use href="#tile-layer4" x="1200" /></g>
    <g id="p-layer-5"><use href="#tile-layer5" x="0" /><use href="#tile-layer5" x="1200" /></g>
  </g>

  <!-- 冲刺海风速度线特效 -->
  <g id="wind-streaks" stroke="#ffffff" stroke-linecap="round" opacity="0"></g>

  <!-- ==================== 戴帽鹈鹕骑粉车 (核心角色与IK系统) ==================== -->
  <g id="cyclist-root" transform="translate(30, 12)">
    <!-- 地面动态车影 -->
    <ellipse id="bike-shadow" cx="565" cy="522" rx="172" ry="13" fill="#2b303c" opacity="0.28" />

    <!-- 1. 后侧腿 (右腿 IK：在车架后方渲染) -->
    <g id="leg-back">
      <!-- 后侧脚踏曲柄 -->
      <line id="crank-back" x1="548" y1="456" x2="548" y2="482" stroke="#adb5bd" stroke-width="6" stroke-linecap="round" />
      <!-- 大腿与小腿 -->
      <line id="thigh-back" x1="504" y1="354" x2="554" y2="405" stroke="#e2e8f0" stroke-width="16" stroke-linecap="round" />
      <line id="shin-back" x1="554" y1="405" x2="548" y2="482" stroke="#e07a16" stroke-width="8.5" stroke-linecap="round" />
      <circle id="knee-back" cx="554" cy="405" r="5.5" fill="#e07a16" />
      <!-- 后侧脚蹼与踏板 -->
      <g id="foot-back" transform="translate(548, 482)">
        <path d="M-8,-4 L22,2 Q26,7 18,9 L-10,6 Z" fill="#e07a16" />
        <rect x="-13" y="5" width="28" height="6" rx="3" fill="#495057" />
      </g>
    </g>

    <!-- 2. 粉红海滩复古单车 -->
    <g id="pink-bicycle">
      <!-- 前后车轮 -->
      <g id="wheel-rear" transform="translate(462, 456)"><use href="#bike-wheel" /></g>
      <g id="wheel-front" transform="translate(668, 456)"><use href="#bike-wheel" /></g>

      <!-- 奶油白复古挡泥板 -->
      <path d="M394,452 A68,68 0 0,1 524,424" fill="none" stroke="#fff8e8" stroke-width="8" stroke-linecap="round" />
      <path d="M604,426 A68,68 0 0,1 734,446" fill="none" stroke="#fff8e8" stroke-width="8" stroke-linecap="round" />

      <!-- 传动链条护罩与动态链条 -->
      <ellipse cx="505" cy="456" rx="54" ry="17" fill="none" stroke="#343a40" stroke-width="3" stroke-dasharray="6 5" id="bike-chain" />

  // 六层视差速率权重 (云 -> 远海帆船 -> 浅海浪 -> 沙滩木屋 -> 公路栈道 -> 前景海草)

  /* =========================================================================

    // 双骨 IK 骨骼节点
    crankFront: $('crank-front'),

  /* =========================================================================
   * 3. 双骨反向运动学求解器 (Analytical 2-Bone IK)
   * ========================================================================= */
  const CRANK_X = 548;
  const CRANK_Y = 456;
  const CRANK_R = 26;
  const L_THIGH = 68;
  const L_SHIN  = 68;

  function solveTwoBoneIK(hipX, hipY, targetX, targetY, L1, L2) {
    let dx = targetX - hipX;
    let dy = targetY - hipY;
    let dist = Math.hypot(dx, dy);

    // 防止极限拉伸产生数值越界
    const maxReach = L1 + L2 - 0.5;
    const minReach = Math.abs(L1 - L2) + 0.5;
    if (dist > maxReach) {
      const scale = maxReach / dist;
      dx *= scale; dy *= scale; dist = maxReach;
    } else if (dist < minReach) {
      dist = minReach;
    }

    // 余弦定理求髋关节张角，膝盖朝骑行前方 (+X/-Y 侧) 弯曲
    const cosAngle = Math.max(-1, Math.min(1, (L1 * L1 + dist * dist - L2 * L2) / (2 * L1 * dist)));
    const baseAngle = Math.atan2(dy, dx);
    const kneeAngle = baseAngle - Math.acos(cosAngle);

    return {
      kx: hipX + Math.cos(kneeAngle) * L1,
      ky: hipY + Math.sin(kneeAngle) * L1
    };
  }

  /* =========================================================================
   * 4. 弹簧质点物理围巾系统 (Spring-Damper Chain)
   * ========================================================================= */
  const SCARF_COUNT = 11;
  const SEG_LEN = 14.5;
  const scarfNodes = Array.from({ length: SCARF_COUNT }, (_, i) => ({
    x: 522 - i * SEG_LEN,
    y: 264 + i * 2,
    vx: 0,
    vy: 0
  }));

  function updateScarfPhysics(anchorX, anchorY, dt, speedKmh, t) {
    scarfNodes[0].x = anchorX;
    scarfNodes[0].y = anchorY;
    scarfNodes[0].vx = 0;
    scarfNodes[0].vy = 0;

    const windDrag = -(135 + speedKmh * 13.5);
    const damping = Math.pow(0.84, dt * 60);

    for (let i = 1; i < SCARF_COUNT; i++) {
      const n = scarfNodes[i];
      // 海风乱流 + 重力平衡，速度越快波动频率越高
      const waveFreq = 6.5 + speedKmh * 0.24;
      const flutter = Math.sin(t * waveFreq - i * 0.68) * (45 + speedKmh * 3.2)
                    + Math.cos(t * (waveFreq * 0.63) - i * 0.4) * 28;
      const gravity = 82 - Math.min(54, speedKmh * 1.6);

      n.vx = (n.vx + windDrag * dt) * damping;
      n.vy = (n.vy + (gravity + flutter) * dt) * damping;

      n.x += n.vx * dt;
      n.y += n.vy * dt;
    }

    // 多轮距离约束松弛 (保证围巾柔顺不拉长)
    for (let iter = 0; iter < 5; iter++) {
      scarfNodes[0].x = anchorX;
      scarfNodes[0].y = anchorY;
      for (let i = 1; i < SCARF_COUNT; i++) {
        const prev = scarfNodes[i - 1];
        const curr = scarfNodes[i];
        const dx = curr.x - prev.x;
        const dy = curr.y - prev.y;
        const d = Math.hypot(dx, dy) || 0.001;
        const diff = (d - SEG_LEN) / d;

        if (i === 1) {
          curr.x -= dx * diff;
          curr.y -= dy * diff;
        } else {
          prev.x += dx * diff * 0.35;
          prev.y += dy * diff * 0.35;
          curr.x -= dx * diff * 0.65;
          curr.y -= dy * diff * 0.65;
        }
      }
    }
  }

  function renderScarf() {
    let d = `M ${scarfNodes[0].x.toFixed(1)} ${scarfNodes[0].y.toFixed(1)}`;
    for (let i = 1; i < SCARF_COUNT - 1; i++) {
      const xc = ((scarfNodes[i].x + scarfNodes[i + 1].x) * 0.5).toFixed(1);
      const yc = ((scarfNodes[i].y + scarfNodes[i + 1].y) * 0.5).toFixed(1);
      d += ` Q ${scarfNodes[i].x.toFixed(1)} ${scarfNodes[i].y.toFixed(1)}, ${xc} ${yc}`;
    }
    const last = scarfNodes[SCARF_COUNT - 1];
    const prev = scarfNodes[SCARF_COUNT - 2];
    d += ` L ${last.x.toFixed(1)} ${last.y.toFixed(1)}`;

    dom.scarfShadow.setAttribute('d', d);
    dom.scarfShadow.setAttribute('transform', 'translate(0, 2.5)');
    dom.scarfMain.setAttribute('d', d);
    dom.scarfStripe.setAttribute('d', d);

    // 围巾末端灵动流苏
    const angle = Math.atan2(last.y - prev.y, last.x - prev.x);
    let tasselSvg = '';
    for (let k = -1; k <= 1; k++) {
      const a = angle + k * 0.28;
      const tx = (last.x + Math.cos(a) * 12).toFixed(1);
      const ty = (last.y + Math.sin(a) * 12).toFixed(1);
      tasselSvg += `<line x1="${last.x.toFixed(1)}" y1="${last.y.toFixed(1)}" x2="${tx}" y2="${ty}" />`;
    }
    dom.scarfTassels.innerHTML = tasselSvg;
  }

  /* =========================================================================
   * 5. 冲刺海风粒子线
   * ========================================================================= */
  const windLines = Array.from({ length: 7 }, (_, i) => ({
    x: Math.random() * 1200,
    y: 170 + i * 58,
    len: 55 + Math.random() * 65
  }));

  function updateWindStreaks(dt, speedKmh) {
    const intensity = Math.max(0, Math.min(0.65, (speedKmh - 20) / 14));
    dom.windStreaks.setAttribute('opacity', intensity.toFixed(2));
    if (intensity <= 0.01) return;

    let paths = '';
    for (const w of windLines) {
      w.x -= speedKmh * 36 * dt;
      if (w.x + w.len < 0) {
        w.x = 1220 + Math.random() * 200;
        w.y = 150 + Math.random() * 360;
      }
      paths += `<line x1="${w.x.toFixed(0)}" y1="${w.y.toFixed(0)}" x2="${(w.x + w.len).toFixed(0)}" y2="${w.y.toFixed(0)}" stroke-width="2.2" />`;
    }
    dom.windStreaks.innerHTML = paths;
  }

  /* =========================================================================
   * 6. Web Audio API 零依赖声音合成 (海风 + 潮汐 + 五声风铃 + 双响车铃)
   * ========================================================================= */
  const audio = {
    ctx: null,
    enabled: false,
    windFilter: null,
    windGain: null,
    surfGain: null,
    chimeTimer: 0.8
  };

  function initWebAudio() {
    if (audio.ctx) return;
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;

    const ctx = new AudioCtx();
    audio.ctx = ctx;

    // 创建 2 秒平滑白噪声缓存用于海风与海浪合成
    const bufSize = ctx.sampleRate * 2;
    const noiseBuf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
    const data = noiseBuf.getChannelData(0);
    let lastOut = 0;
    for (let i = 0; i < bufSize; i++) {
      const white = Math.random() * 2 - 1;
      // 柔和粉红噪声滤波，听感温暖不刺耳
      data[i] = (lastOut + 0.04 * white) / 1.04;
      lastOut = data[i];
      data[i] *= 2.4;
    }

    // 通道 A：随车速实时变化的骑行耳畔海风
    const windSrc = ctx.createBufferSource();
    windSrc.buffer = noiseBuf;
    windSrc.loop = true;

    const windFilter = ctx.createBiquadFilter();
    windFilter.type = 'bandpass';
    windFilter.frequency.value = 340;
    windFilter.Q.value = 1.3;

    const windGain = ctx.createGain();
    windGain.gain.value = 0;

    windSrc.connect(windFilter);
    windFilter.connect(windGain);
    windGain.connect(ctx.destination);
    windSrc.start();

    // 通道 B：轻柔起伏的远方海浪底噪
    const surfSrc = ctx.createBufferSource();
    surfSrc.buffer = noiseBuf;
    surfSrc.loop = true;

    const surfFilter = ctx.createBiquadFilter();
    surfFilter.type = 'lowpass';
    surfFilter.frequency.value = 210;

    const surfGain = ctx.createGain();
    surfGain.gain.value = 0;

    surfSrc.connect(surfFilter);
    surfFilter.connect(surfGain);
    surfGain.connect(ctx.destination);
    surfSrc.start();

    audio.windFilter = windFilter;
    audio.windGain = windGain;
    audio.surfGain = surfGain;
  }

  function setAudioEnabled(flag) {
    initWebAudio();
    if (!audio.ctx) return;
    if (audio.ctx.state === 'suspended') audio.ctx.resume();

    audio.enabled = flag;
    if (flag) {
      dom.btnAudioBg.setAttribute('fill', '#4361ee');
      dom.btnAudioLabel.setAttribute('fill', '#ffffff');
      dom.btnAudioLabel.textContent = '🎐 风铃海风: 开';
    } else {
      dom.btnAudioBg.setAttribute('fill', '#e9ecef');
      dom.btnAudioLabel.setAttribute('fill', '#495057');
      dom.btnAudioLabel.textContent = '🎐 风铃海风: 关';
      const now = audio.ctx.currentTime;
      audio.windGain.gain.setTargetAtTime(0, now, 0.08);
      audio.surfGain.gain.setTargetAtTime(0, now, 0.08);
    }
  }

  // 合成清脆海岸五声音阶风铃
  const CHIME_NOTES = [1046.5, 1174.7, 1318.5, 1568.0, 1760.0, 2093.0]; // C6 D6 E6 G6 A6 C7
  function playWindChimeNote() {
    if (!audio.enabled || !audio.ctx || state.paused) return;
    const ctx = audio.ctx;
    const now = ctx.currentTime;
    const freq = CHIME_NOTES[Math.floor(Math.random() * CHIME_NOTES.length)];

    const osc1 = ctx.createOscillator();
    const osc2 = ctx.createOscillator();
    const gain = ctx.createGain();

    osc1.type = 'sine';
    osc2.type = 'triangle';
    osc1.frequency.setValueAtTime(freq, now);
    osc2.frequency.setValueAtTime(freq * 2.756, now); // 金属管泛音比

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(0.042, now + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.65);

    const g2 = ctx.createGain();
    g2.gain.value = 0.18;

    osc1.connect(gain);
    osc2.connect(g2);
    g2.connect(gain);
    gain.connect(ctx.destination);

    osc1.start(now);
    osc2.start(now);
    osc1.stop(now + 1.7);
    osc2.stop(now + 1.7);
  }

  // 合成清脆复古机械双响单车铃 ("叮铃—叮铃！")
  function triggerBicycleBell() {
    if (!audio.enabled) setAudioEnabled(true);
    if (!audio.ctx) return;
    if (audio.ctx.state === 'suspended') audio.ctx.resume();

    state.bellAnim = 0.55;
    const ctx = audio.ctx;
    const baseNow = ctx.currentTime;

    [0, 0.095].forEach((offset, idx) => {
      const t0 = baseNow + offset;
      const partials = [1780, 3690, 5240];
      partials.forEach((f, pIdx) => {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f * (idx === 1 ? 1.015 : 1), t0);

        const amp = (0.11 / (pIdx + 1));
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.linearRampToValueAtTime(amp, t0 + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + (0.65 - pIdx * 0.14));

        osc.connect(g);
        g.connect(ctx.destination);
        osc.start(t0);
        osc.stop(t0 + 0.7);
      });
    });
  }

  function updateAudioFrame(dt) {
    if (!audio.enabled || !audio.ctx) return;
    const now = audio.ctx.currentTime;

    if (state.paused) {
      audio.windGain.gain.setTargetAtTime(0.005, now, 0.1);
      audio.surfGain.gain.setTargetAtTime(0.015, now, 0.1);
      return;
    }

    // 车速驱动风噪频率与音量
    const normSpeed = Math.min(1.5, state.speedKmh / 24);
    audio.windFilter.frequency.setTargetAtTime(260 + normSpeed * 520, now, 0.08);
    audio.windGain.gain.setTargetAtTime(0.025 + normSpeed * 0.085, now, 0.08);

    // 呼吸感海浪
    const surfWave = 0.032 + Math.sin(state.time * 0.85) * 0.016;
    audio.surfGain.gain.setTargetAtTime(surfWave, now, 0.12);

    // 随机海风触发风铃，车速越快越轻快
    audio.chimeTimer -= dt * (0.7 + normSpeed * 0.9);
    if (audio.chimeTimer <= 0) {
      playWindChimeNote();
      if (Math.random() < 0.35) setTimeout(playWindChimeNote, 130);
      audio.chimeTimer = 0.75 + Math.random() * 1.9;
    }
  }

  /* =========================================================================
   * 7. 交互事件绑定 (加速 / 车铃 / 暂停 / 音效 / 键盘快捷键)
   * ========================================================================= */
  function boostImpulse() {
    if (!audio.enabled) setAudioEnabled(true);
    if (state.paused) togglePause();
    state.targetBoost = Math.min(16, state.targetBoost + 6.5);
  }

  dom.btnBoost.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    state.holdingBoost = true;
    boostImpulse();
  });
  window.addEventListener('pointerup', () => { state.holdingBoost = false; });
  window.addEventListener('pointercancel', () => { state.holdingBoost = false; });

  dom.btnBell.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    triggerBicycleBell();
  });

  function togglePause() {
    state.paused = !state.paused;
    if (state.paused) {
      dom.btnPauseBg.setAttribute('fill', '#ff7b00');
      dom.btnPauseLabel.textContent = '▶ 继续骑行';
      dom.pausedBadge.setAttribute('opacity', '1');
    } else {
      dom.btnPauseBg.setAttribute('fill', '#2ec4b6');
      dom.btnPauseLabel.textContent = '⏸ 暂停日记';
      dom.pausedBadge.setAttribute('opacity', '0');
    }
  }

  dom.btnPause.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    togglePause();
  });

  dom.btnAudio.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    setAudioEnabled(!audio.enabled);
  });

  // 支持直接点击车上铃铛或键盘操作 (Up/Space 加速, B 响铃, P 暂停)
  $('bike-bell-unit').style.cursor = 'pointer';
  $('bike-bell-unit').addEventListener('pointerdown', triggerBicycleBell);

  window.addEventListener('keydown', (e) => {
    if (e.code === 'ArrowRight' || e.code === 'ArrowUp' || e.code === 'Space') {
      state.holdingBoost = true;
      boostImpulse();
    } else if (e.code === 'KeyB') {
      triggerBicycleBell();
    } else if (e.code === 'KeyP') {
      togglePause();
    }
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowRight' || e.code === 'ArrowUp' || e.code === 'Space') {
      state.holdingBoost = false;
    }
  });

  /* =========================================================================
   * 8. 主动画循环 (60fps 视差 + 双骨IK + 弹簧围巾 + 实时仪表)
   * ========================================================================= */
  let lastTs = performance.now();

  function tick(now) {
    const rawDt = (now - lastTs) / 1000;
    lastTs = now;
    const dt = Math.min(0.05, Math.max(0.001, rawDt));

    if (!state.paused) {
      state.time += dt;

      // 1. 速度平滑过渡与微弱海风自然呼吸感波动
      if (state.holdingBoost) {
        state.targetBoost = Math.min(16, state.targetBoost + 18 * dt);
      } else {
        state.targetBoost = Math.max(0, state.targetBoost - 4.8 * dt);
      }
      const breezeJitter = Math.sin(state.time * 2.1) * 0.18 + Math.cos(state.time * 5.3) * 0.08;
      const desiredSpeed = Math.min(MAX_SPEED_KMH, BASE_SPEED_KMH + state.targetBoost + breezeJitter);
      state.speedKmh += (desiredSpeed - state.speedKmh) * Math.min(1, dt * 6.5);

      // 实时里程累加 (km/h -> km/s) 与踏频同步
      state.distanceKm += (state.speedKmh / 3600) * dt;
      state.rpm = state.speedKmh * KM_TO_RPM;

      // 2. 曲柄与车轮角速度积分 (111 RPM = 1.85 圈/秒)
      const crankRadPerSec = (state.rpm / 60) * Math.PI * 2;
      state.crankAngle = (state.crankAngle + crankRadPerSec * dt) % (Math.PI * 2);
      state.wheelAngle = (state.wheelAngle + (crankRadPerSec * 2.15 * 180 / Math.PI) * dt) % 360;

      // 3. 六层无缝视差滚动 (公路基准像素速度与车轮周长严格匹配)
      const roadPxPerSec = state.speedKmh * 17.2;
      for (let i = 0; i < 6; i++) {
        state.layerOffsets[i] = (state.layerOffsets[i] + roadPxPerSec * PARALLAX_FACTORS[i] * dt) % TILE_WIDTH;
        dom.layers[i].setAttribute('transform', `translate(${-state.layerOffsets[i].toFixed(2)}, 0)`);
      }

      // 远海白帆船随波轻轻摇晃，浅海波浪微浮
      const waveBob = Math.sin(state.time * 2.4) * 2.8;
      dom.layers[2].setAttribute('transform', `translate(${-state.layerOffsets[2].toFixed(2)}, ${waveBob.toFixed(2)})`);
      dom.sailboats.forEach((boat, idx) => {
        const rock = Math.sin(state.time * 2.2 + idx * 1.7) * 3.5;
        const base = idx === 0 ? 'translate(210, 272)' : idx === 1 ? 'translate(640, 266) scale(0.78)' : 'translate(1015, 274) scale(0.92)';
        boat.setAttribute('transform', `${base} rotate(${rock.toFixed(2)})`);
      });

      // 4. 车轮、花瓣牙盘与链条同步运转
      dom.wheelRear.setAttribute('transform', `translate(462, 456) rotate(${state.wheelAngle.toFixed(1)})`);
      dom.wheelFront.setAttribute('transform', `translate(668, 456) rotate(${state.wheelAngle.toFixed(1)})`);
      dom.crankWheel.setAttribute('transform', `translate(548, 456) rotate(${(state.crankAngle * 180 / Math.PI).toFixed(1)})`);
      dom.bikeChain.setAttribute('stroke-dashoffset', (-state.wheelAngle * 0.45).toFixed(1));

      // 5. 鹈鹕踩踏韵律起伏 + 冲刺前倾姿态
      const bounceY = Math.sin(state.crankAngle * 2) * 3.2;
      const leanDeg = Math.min(7.5, Math.max(0, (state.speedKmh - 17.5) * 0.42));
      const hipX = 504 + leanDeg * 0.6;
      const hipY = 352 + bounceY;

      dom.bodyGroup.setAttribute(
        'transform',
        `translate(0, ${bounceY.toFixed(2)}) rotate(${leanDeg.toFixed(2)}, 506, 344)`
      );

      // 鹈鹕大喉囊弹性微颤 & 小尾羽欢快摆动
      const pouchJiggle = Math.sin(state.crankAngle * 2 - 0.9) * 2.4;
      dom.pouch.setAttribute('transform', `rotate(${pouchJiggle.toFixed(2)}, 38, -42)`);
      const tailWag = Math.sin(state.crankAngle * 2 + 0.6) * 5.5;
      dom.tail.setAttribute('transform', `translate(466, 326) rotate(${tailWag.toFixed(2)})`);

      // 自然眨眼
      state.blinkTimer -= dt;
      if (state.blinkTimer <= 0) {
        dom.eye.setAttribute('transform', 'translate(30, -58) scale(1, 0.12)');
        if (state.blinkTimer <= -0.13) {
          dom.eye.setAttribute('transform', 'translate(30, -58) scale(1, 1)');
          state.blinkTimer = 2.6 + Math.random() * 2.8;
        }
      }

      // 6. 双骨 IK 实时解算左右双腿与脚蹼角度
      // 前侧腿 (左腿：相位 crankAngle)
      const pFrontX = CRANK_X + Math.cos(state.crankAngle) * CRANK_R;
      const pFrontY = CRANK_Y + Math.sin(state.crankAngle) * CRANK_R;
      const ikFront = solveTwoBoneIK(hipX, hipY, pFrontX, pFrontY, L_THIGH, L_SHIN);

      dom.crankFront.setAttribute('x2', pFrontX.toFixed(1));
      dom.crankFront.setAttribute('y2', pFrontY.toFixed(1));
      dom.thighFront.setAttribute('x1', hipX.toFixed(1));
      dom.thighFront.setAttribute('y1', hipY.toFixed(1));
      dom.thighFront.setAttribute('x2', ikFront.kx.toFixed(1));
      dom.thighFront.setAttribute('y2', ikFront.ky.toFixed(1));
      dom.thighFrontOutline.setAttribute('x1', hipX.toFixed(1));
      dom.thighFrontOutline.setAttribute('y1', hipY.toFixed(1));
      dom.thighFrontOutline.setAttribute('x2', ikFront.kx.toFixed(1));
      dom.thighFrontOutline.setAttribute('y2', ikFront.ky.toFixed(1));
      dom.shinFront.setAttribute('x1', ikFront.kx.toFixed(1));
      dom.shinFront.setAttribute('y1', ikFront.ky.toFixed(1));
      dom.shinFront.setAttribute('x2', pFrontX.toFixed(1));
      dom.shinFront.setAttribute('y2', pFrontY.toFixed(1));
      dom.kneeFront.setAttribute('cx', ikFront.kx.toFixed(1));
      dom.kneeFront.setAttribute('cy', ikFront.ky.toFixed(1));
      const ankleTiltFront = Math.sin(state.crankAngle - 0.4) * 11;
      dom.footFront.setAttribute('transform', `translate(${pFrontX.toFixed(1)}, ${pFrontY.toFixed(1)}) rotate(${ankleTiltFront.toFixed(1)})`);

      // 后侧腿 (右腿：相差 180° 相位)
      const backAngle = state.crankAngle + Math.PI;
      const pBackX = CRANK_X + Math.cos(backAngle) * CRANK_R;
      const pBackY = CRANK_Y + Math.sin(backAngle) * CRANK_R;
      const ikBack = solveTwoBoneIK(hipX + 4, hipY - 2, pBackX, pBackY, L_THIGH, L_SHIN);

      dom.crankBack.setAttribute('x2', pBackX.toFixed(1));
      dom.crankBack.setAttribute('y2', pBackY.toFixed(1));
      dom.thighBack.setAttribute('x1', (hipX + 4).toFixed(1));
      dom.thighBack.setAttribute('y1', (hipY - 2).toFixed(1));
      dom.thighBack.setAttribute('x2', ikBack.kx.toFixed(1));
      dom.thighBack.setAttribute('y2', ikBack.ky.toFixed(1));
      dom.shinBack.setAttribute('x1', ikBack.kx.toFixed(1));
      dom.shinBack.setAttribute('y1', ikBack.ky.toFixed(1));
      dom.shinBack.setAttribute('x2', pBackX.toFixed(1));
      dom.shinBack.setAttribute('y2', pBackY.toFixed(1));
      dom.kneeBack.setAttribute('cx', ikBack.kx.toFixed(1));
      dom.kneeBack.setAttribute('cy', ikBack.ky.toFixed(1));
      const ankleTiltBack = Math.sin(backAngle - 0.4) * 11;
      dom.footBack.setAttribute('transform', `translate(${pBackX.toFixed(1)}, ${pBackY.toFixed(1)}) rotate(${ankleTiltBack.toFixed(1)})`);

      // 7. 翅膀肩部随身体起伏，翼尖稳握车把 (576, 304)
      const shX = 510 + leanDeg * 1.15;
      const shY = 282 + bounceY;
      dom.wing.setAttribute(
        'd',
        `M${shX.toFixed(1)},${shY.toFixed(1)} C${(shX + 14).toFixed(1)},${(shY - 14).toFixed(1)} 548,274 576,304 C560,316 534,${(314 + bounceY * 0.5).toFixed(1)} ${(shX + 4).toFixed(1)},${(shY + 22).toFixed(1)} C${(shX - 6).toFixed(1)},${(shY + 16).toFixed(1)} ${(shX - 8).toFixed(1)},${(shY + 8).toFixed(1)} ${shX.toFixed(1)},${shY.toFixed(1)} Z`
      );
      dom.wingFeathers.setAttribute(
        'd',
        `M${(shX + 14).toFixed(1)},${(shY + 15).toFixed(1)} Q544,306 566,303 M${(shX + 8).toFixed(1)},${(shY + 7).toFixed(1)} Q538,296 558,295`
      );

      // 8. 弹簧物理围巾锚点跟随脖颈更新
      const neckAnchorX = 523 + leanDeg * 1.35;
      const neckAnchorY = 263 + bounceY;
      updateScarfPhysics(neckAnchorX, neckAnchorY, dt, state.speedKmh, state.time);
      renderScarf();

      // 9. 冲刺风线与仪表实时数字刷新
      updateWindStreaks(dt, state.speedKmh);

      dom.valSpeed.textContent = state.speedKmh.toFixed(1);
      dom.valDist.textContent = state.distanceKm.toFixed(2);
      dom.valRpm.textContent = Math.round(state.rpm).toString();

      // 迷你表盘指针 (-110° ~ +110°)
      const needleAngle = -110 + Math.min(1, state.speedKmh / 35) * 220;
      dom.gaugeNeedle.setAttribute('transform', `rotate(${needleAngle.toFixed(1)}, 18, 40)`);
    }

    // 车铃拨片与声波动画 (即使暂停也可按响车铃互动)
    if (state.bellAnim > 0) {
      state.bellAnim = Math.max(0, state.bellAnim - dt);
      const buzz = Math.sin(state.bellAnim * 65) * 18;
      dom.bellLever.setAttribute('transform', `rotate(${buzz.toFixed(1)}, -9, 4)`);
      dom.bellRings.setAttribute('opacity', Math.min(1, state.bellAnim * 2.4).toFixed(2));
      const ringScale = 1 + (0.55 - state.bellAnim) * 0.65;
      dom.bellRings.setAttribute('transform', `scale(${ringScale.toFixed(2)})`);
    } else {
      dom.bellRings.setAttribute('opacity', '0');
    }

    updateAudioFrame(dt);
    requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
