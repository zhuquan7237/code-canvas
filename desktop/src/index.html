<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>代码画布 · Code Canvas Desktop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell" id="appShell">
    <!-- Left Catalog Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand-lockup">
          <div class="brand-logo" aria-hidden="true">&lt;/&gt;</div>
          <div>
            <div class="brand-title">代码画布</div>
            <div class="brand-subtitle" id="catalogCountLabel">全部作品 · 0</div>
          </div>
        </div>
        <button class="icon-btn" id="btnToggleSidebar" title="收起侧边目录 (Ctrl+B)" aria-label="收起目录">
          <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
      </div>

      <div class="sidebar-actions">
        <button class="btn-primary hero-paste-btn" id="btnQuickPaste" title="从剪贴板智能提取代码并预览 (Ctrl+Shift+V)">
          <svg viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>
          <span>粘贴并预览</span>
        </button>
        <div class="sidebar-sub-actions">
          <button class="btn-subtle" id="btnNewDoc" title="新建空白画布 (Ctrl+N)">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            <span>新建</span>
          </button>
          <button class="btn-subtle" id="btnImportFile" title="从电脑导入文件 (Ctrl+O)">
            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span>导入文件</span>
          </button>
        </div>
      </div>

      <!-- Search Pill -->
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="inputSearch" placeholder="搜索文件名或代码内容…" autocomplete="off" />
      </div>

      <!-- Type Filter Pills -->
      <div class="filter-pills" id="filterPills" role="tablist" aria-label="作品类型筛选">
        <button class="filter-pill active" data-filter="ALL">全部</button>
        <button class="filter-pill" data-filter="HTML">HTML</button>
        <button class="filter-pill" data-filter="SVG">SVG</button>
        <button class="filter-pill" data-filter="XML">XML</button>
        <button class="filter-pill" data-filter="RAW">其它</button>
      </div>

      <!-- Document List -->
      <div class="doc-list" id="docList" role="listbox" aria-label="作品列表"></div>

      <!-- Sidebar Footer -->
      <div class="sidebar-footer">
        <div class="theme-switcher" role="group" aria-label="外观模式">
          <button class="segment-btn" data-theme-mode="light">浅色</button>
          <button class="segment-btn" data-theme-mode="dark">深色</button>
          <button class="segment-btn active" data-theme-mode="system">跟随系统</button>
        </div>
        <button class="icon-btn" id="btnOpenStorage" title="打开本地数据文件夹">
          <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        </button>
      </div>
    </aside>

    <!-- Main Workbench -->
    <main class="workbench">
      <!-- Clipboard Auto-Detect Banner -->
      <div class="clipboard-banner hidden" id="clipboardBanner">
        <div class="banner-left">
          <span class="banner-badge">检测到剪贴板代码</span>
          <span class="banner-snippet" id="bannerSnippet"></span>
        </div>
        <div class="banner-actions">
          <button class="btn-primary btn-sm" id="btnBannerImport">导入并预览</button>
          <button class="icon-btn btn-sm" id="btnBannerDismiss" title="忽略">
            <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>

      <!-- Top Header Bar -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn hidden" id="btnExpandSidebar" title="展开侧边目录 (Ctrl+B)">
            <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div class="doc-title-group" id="titleEditTrigger" title="点击重命名画布">
            <span class="doc-title-text" id="currentDocTitle">未命名画布.html</span>
            <svg class="edit-glyph" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          </div>
          <span class="kind-chip" id="currentKindBadge">HTML</span>
          <span class="save-status" id="saveStatus">已自动保存</span>
        </div>

        <!-- Center View Mode Switcher -->
        <div class="view-mode-track" role="tablist" aria-label="视图模式">
          <button class="segment-btn active" data-view-mode="split">分屏对照</button>
          <button class="segment-btn" data-view-mode="code">仅代码</button>
          <button class="segment-btn" data-view-mode="preview">仅预览</button>
        </div>

        <!-- Right Controls -->
        <div class="topbar-right">
          <button class="btn-subtle" id="btnToggleGrid" title="切换透明网格背景">网格底</button>
          <button class="btn-subtle" id="btnPinTop" title="窗口始终置顶">置顶</button>
          <button class="btn-subtle" id="btnRefreshPreview" title="重新渲染预览 (Ctrl+R)">刷新</button>
          <button class="btn-subtle" id="btnCopyCode" title="复制全部源码">复制源码</button>
          <button class="btn-subtle" id="btnExportDoc" title="导出源码文件 (Ctrl+S)">导出</button>
          <button class="icon-btn" id="btnDeleteDoc" title="删除当前画布">
            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
          </button>
        </div>
      </header>

      <!-- Split Workspace: Code Editor + Live Preview Canvas -->
      <section class="workspace split" id="workspace">
        <!-- Code Pane -->
        <div class="pane code-pane" id="codePane">
          <div class="code-toolbar">
            <div class="symbol-strip" id="symbolStrip">
              <button class="sym-btn" data-insert="<>">&lt;&gt;</button>
              <button class="sym-btn" data-insert="{}">{}</button>
              <button class="sym-btn" data-insert="()">()</button>
              <button class="sym-btn" data-insert="[]">[]</button>
              <button class="sym-btn" data-insert='""'>""</button>
              <button class="sym-btn" data-insert="=">=</button>
              <button class="sym-btn" data-insert="/">/</button>
              <button class="sym-btn" data-insert="  ">Tab</button>
            </div>
            <div class="code-stats" id="codeStats">1 行 · 0 字符</div>
          </div>
          <div class="editor-surface">
            <div class="line-gutter" id="lineGutter" aria-hidden="true">1</div>
            <textarea id="codeEditor" spellcheck="false" placeholder="输入或粘贴 HTML / SVG / XML 代码…"></textarea>
          </div>
        </div>

        <!-- Preview Canvas Pane -->
        <div class="pane preview-pane" id="previewPane">
          <div class="preview-card" id="previewCard">
            <iframe id="previewFrame" sandbox="allow-scripts" title="作品实时预览画布"></iframe>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Unified Modal Dialog (Rename / New / Multi-block Picker / Delete Confirm) -->
  <div class="modal-backdrop hidden" id="modalBackdrop">
    <div class="modal-card" id="modalCard" role="dialog" aria-modal="true">
      <h3 class="modal-title" id="modalTitle">标题</h3>
      <p class="modal-subtitle" id="modalSubtitle"></p>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-actions" id="modalActions">
        <button class="btn-subtle" id="modalCancelBtn">取消</button>
        <button class="btn-primary" id="modalConfirmBtn">确定</button>
      </div>
    </div>
  </div>

  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
