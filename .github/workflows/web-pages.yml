name: Code Canvas web
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: code-canvas-github-pages
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Temporarily hold the legacy PWA while the new edition is verified
        run: |
          mkdir -p _site/en
          cp web/site/site.css _site/site.css
          cat > _site/index.html <<'HTML'
          <!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>代码画布</title><link rel="stylesheet" href="./site.css"><main class="shell band"><h1>代码画布</h1><p>代码画布已迁到独立域名。基于 Apple 版设计的网页版正在验证，旧网页版已下线。</p><p><a href="https://github.com/zhuquan7237/code-canvas">GitHub 与安卓版</a> · <a href="./en/" lang="en">English</a></p></main></html>
          HTML
          cat > _site/en/index.html <<'HTML'
          <!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Code Canvas</title><link rel="stylesheet" href="../site.css"><main class="shell band"><h1>Code Canvas</h1><p>Code Canvas has a dedicated address. The web edition based on its Apple design is undergoing verification. The previous web edition is retired.</p><p><a href="https://github.com/zhuquan7237/code-canvas">GitHub and Android</a> · <a href="../" lang="zh-CN">中文</a></p></main></html>
          HTML
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for uploaded artifact to be indexed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for attempt in $(seq 1 18); do
            count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false and .size_in_bytes > 0)] | length' || true)"
            if [ "$count" = 1 ]; then
              sleep 5
              exit 0
            fi
            sleep 5
          done
          echo 'The Pages artifact did not become visible to the deployment job.' >&2
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

